name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione X.Y.Z da rilasciare (vuoto = solo verifica)"
        required: false
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm

      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Bundle del servizio
        run: pnpm build:service

      - name: Prova del pacchetto (avvio estratto, SIGTERM, log JSON)
        run: bash scripts/package-check.sh

      - name: Build della web UI (regressioni)
        run: pnpm build

      # Nelle PR il bundle committato deve coincidere con quello ricostruito:
      # la release HomeGate usa il contenuto del commit, non asset esterni.
      - name: Bundle committato aggiornato
        if: github.event_name == 'pull_request'
        run: git diff --exit-code dist/main.js

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Coerenza VERSION
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          if [ "${VERSION}" != "${{ inputs.version }}" ]; then
            echo "VERSION (${VERSION}) diversa dalla versione richiesta (${{ inputs.version }})" >&2
            exit 1
          fi

      - name: Tag e canale stable
        run: |
          TAG="v${{ inputs.version }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Il tag ${TAG} esiste già: serve una versione nuova." >&2
            exit 1
          fi
          SHA="$(git rev-parse HEAD)"
          git tag "${TAG}" "${SHA}"
          git push origin "${TAG}"
          # stable punta allo stesso commit del tag: canale di aggiornamento HomeGate.
          git push origin "${SHA}:refs/heads/stable"
