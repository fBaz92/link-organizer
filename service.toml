schema = 1
id = "link-organizer"
description = "Archivio personale di link, video, articoli e documenti: un bot Telegram li raccoglie e organizza al volo, e dal Raspberry si rileggono e cercano tramite la pagina web inclusa, nella rete di casa."

[release]
repository = "fBaz92/link-organizer"
runtime = "node"
entrypoint = "dist/main.js"
runtime_min = "22.13.0"
architectures = ["arm64", "amd64"]
os = "linux"

[[environment]]
key = "BOT_TOKEN"
label = "Token del bot Telegram"
description = "Token rilasciato da @BotFather per il bot che raccoglie link e file"
type = "string"
secret = true
required = true

[[environment]]
key = "TELEGRAM_ALLOWED_USER_IDS"
label = "ID Telegram autorizzati"
description = "ID numerici separati da virgola: solo questi utenti possono usare il bot (il bot è privato)"
type = "string"
secret = false
required = true
parameter = true

[[environment]]
key = "WEB_PASSWORD"
label = "Password della pagina web"
description = "Password di accesso al visualizzatore web incluso; lasciarla vuota non è ammesso in LAN"
type = "string"
secret = true
required = true

[[environment]]
key = "PORT"
label = "Porta HTTP"
description = "Porta su cui il visualizzatore web ascolta nella LAN"
type = "integer"
secret = false
required = true
parameter = true
min = 1024
max = 65535
default = "8787"

[[environment]]
key = "WEB_APP_URL"
label = "URL pubblico della pagina web"
description = "Indirizzo con cui raggiungere il visualizzatore dal browser (usato dal bot per i deep link); se vuoto viene stimato dall'indirizzo LAN del Raspberry"
type = "string"
secret = false
required = false
parameter = true

[[environment]]
key = "TELEGRAM_UPLOAD_CHAT_ID"
label = "Chat di destinazione dei video"
description = "Chat Telegram che riceve i video scaricati dal wizard; default: il primo ID autorizzato"
type = "string"
secret = false
required = false
parameter = true

[[environment]]
key = "YTDLP_PATH"
label = "Percorso di yt-dlp"
description = "Eseguibile yt-dlp già installato sul dispositivo (serve anche ffmpeg per la qualità 720p); default: yt-dlp cercato nel PATH"
type = "string"
secret = false
required = false
parameter = true

[[databases]]
id = "stash"
label = "Archivio Stash"
description = "Database SQLite dell'archivio: item, tag e indice full-text. Facoltativo: senza upload il servizio crea il database al primo avvio."
required = false
path = "stash.db"
user_version = 2

[databases.tables]
items = ["id", "type", "url", "canonical_url", "url_hash", "title", "description", "notes", "thumbnail_path", "file_path", "file_name", "mime_type", "file_hash", "author_name", "author_url", "source", "source_ref", "seen", "starred", "created_at", "updated_at"]
tags = ["id", "name"]
items_tags = ["item_id", "tag_id"]
