schema = 1
id = "link-organizer"
description = "Archivio personale di link, video, articoli e documenti: un bot Telegram li raccoglie e organizza al volo, e la webapp completa girata sul Raspberry permette di cercarli, annotarli e scaricare i video dalla rete di casa."

[release]
repository = "fBaz92/link-organizer"
runtime = "docker"
entrypoint = "service.toml"
architectures = ["arm64", "amd64"]
os = "linux"

[container]
# Digest immutabile dell'indice multiarch: aggiornato dal workflow di
# release (docker-release.yml) dopo il push su GHCR. Nessun tag mobile.
image = "ghcr.io/fbaz92/link-organizer@sha256:PENDING"
port = 3000
proxy_port = 8790
health_path = "/health"
startup_timeout = 90
memory_mb = 768
cpus = 1.0

[[environment]]
key = "HOMEGATE_IDLE_MINUTES"
label = "Riposo dopo inattività"
description = "Minuti senza richieste prima di fermare il container: durante il riposo anche il bot Telegram è fermo; una scheda della webapp aperta lo tiene svegliato"
type = "integer"
secret = false
required = true
parameter = true
min = 1
max = 1440
default = "1440"

[[environment]]
key = "BOT_TOKEN"
label = "Token del bot Telegram"
description = "Token rilasciato da @BotFather per il bot che raccoglie link e file"
type = "string"
secret = true
required = true

[[environment]]
key = "TELEGRAM_ALLOWED_USER_IDS"
label = "ID Telegram autorizzati"
description = "ID numerici separati da virgola: solo questi utenti possono usare il bot (il bot è privato)"
type = "string"
secret = false
required = true
parameter = true

[[environment]]
key = "WEB_PASSWORD"
label = "Password della webapp"
description = "Password di accesso alla web UI completa"
type = "string"
secret = true
required = true

[[environment]]
key = "WEB_APP_URL"
label = "URL pubblico della webapp"
description = "Indirizzo con cui raggiungere il servizio dal browser, usato dal bot per i deep link (es. http://IP-DEL-GATEWAY:8790); se vuoto si stima dalla rete"
type = "string"
secret = false
required = false
parameter = true

[[environment]]
key = "TELEGRAM_UPLOAD_CHAT_ID"
label = "Chat di destinazione dei video"
description = "Chat Telegram che riceve i video scaricati dal wizard; default: il primo ID autorizzato"
type = "string"
secret = false
required = false
parameter = true

[[environment]]
key = "YTDLP_PATH"
label = "Percorso di yt-dlp"
description = "L'immagine include yt-dlp e ffmpeg: serve solo per puntare a un binario diverso"
type = "string"
secret = false
required = false
parameter = true

[[databases]]
id = "stash"
label = "Archivio Stash"
description = "Database SQLite dell'archivio: item, tag e indice full-text. Facoltativo: senza upload il servizio crea il database al primo avvio."
required = false
path = "stash.db"
user_version = 2

[databases.tables]
items = ["id", "type", "url", "canonical_url", "url_hash", "title", "description", "notes", "thumbnail_path", "file_path", "file_name", "mime_type", "file_hash", "author_name", "author_url", "source", "source_ref", "seen", "starred", "created_at", "updated_at"]
tags = ["id", "name"]
items_tags = ["item_id", "tag_id"]
